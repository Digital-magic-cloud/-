<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS常用属性</title>

    <style>
        .block{
            background-color: aqua;
            width: 150px;
            height: 100px;
        }
        .inline{
            background-color: brown;
            /* 无效 */
            width: 150px;
            height: 100px;
        }
        .inline-block{
            width: 200px;
        }
        .div-inline{
            display: inline;
            background-color: blue;
        }
        .span-inline-block{
            display: inline-block;
            background-color: purple;
            width: 300px;
        }

    </style>
    
</head>
<body>
    <h1 style="font: bolder 50px 'KaiTi';">font 复合属性示例</h1>
    <p style="line-height: 40px;">这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本</p>

    <!-- width height -->
    <div class="block">这是一个块元素</div>
    <div class="block">这是一个块元素</div>
    <span class="inline">这是一个行内元素</span>
    <img class="inline-block" src="./fufu.jpg" alt="">
    <img class="inline-block" src="./fufu.jpg" alt="">
    <img class="inline-block" src="./fufu.jpg" alt="">
    <h2>display</h2>
    <div class="div-inline">这是一个转换成行内元素的 div 标签</div>
    <span class="span-inline-block">这是一个转换成行内块元素的 span 标签</span>

</body>
</html>
