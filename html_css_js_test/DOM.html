<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM</title>
</head>
<body>
    <div id="box1">这是一个ID选择器标签</div>
    <div class="box2">这是一个类选择器标签</div>
    <div>普通div标签</div>

    <button>点击按钮</button>
    
    <script>
        var element_id = document.getElementById('box1');
        console.log(element_id);
        
        var element_class = document.getElementsByClassName('box2')[0];
        console.log(element_class);

        var element_tag = document.getElementsByTagName('div')[2];
        console.log(element_tag);

        // element_id.innerHTML = '修改内容';
        // element_class.innerText = '修改后内容'

        element_id.innerHTML = '<a href="#">链接</a>';
        element_class.innerText = '<a href="#">链接</a>';

        element_tag.style.color = 'red';
        element_tag.style.fontSize = '30px';

        //DOM 属性绑定事件
        var btn_element = document.getElementsByTagName('button')[0];
        // console.log(btn_element);

        // btn_element.onclick = function(){
        //     alert('DOM 属性按键触发')
        // }

        // btn_element.addEventListener('click',function(){
        //     alert('通过 addEventListener 触发按键');
        // });
        btn_element.addEventListener('click',click_event);
        
        function click_event(){
            alert('通过 addEventListener 触发按键');
        }
    </script>
    
</body>
</html>
